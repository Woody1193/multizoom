name: release

# Publish a version: the .deb and zip go on its GitHub release (created, or
# added to one made on the website), and the .deb into the signed apt
# repository served by GitHub Pages. Runs when a tag like v1.2.3 is pushed or
# a release is published on the website, or by hand for an existing tag.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v1.2.3
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs gnome-shell libglib2.0-bin unzip apt-utils

      - name: Run unit tests
        run: make test

      - name: Build package
        run: make deb VERSION="${TAG#v}"

      - name: Install package
        run: sudo apt-get install -y ./dist/*.deb

      - name: Build apt repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: packaging/build-apt-repo.sh dist/*.deb site

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.deb dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.deb dist/*.zip --generate-notes
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
